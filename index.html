<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoShop - Catálogo Interactivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <h1>🌱 EcoShop Dashboard</h1>
        </div>
        <button id="btn-theme-toggle" class="btn-theme">Modo Oscuro</button>
    </header>

    <main class="dashboard-container">

        <aside class="sidebar">
            
            <section class="search-section">
                <h2>Buscador</h2>
                <input type="text" id="input-busqueda" class="search-input" placeholder="Buscar producto por nombre...">
            </section>

            <section class="filters-section">
                <h2>Categorías</h2>
                <div id="contenedor-filtros" class="filter-buttons">
                    <button class="btn-filtro active" data-categoria="todas">Todas</button>
                    <button class="btn-filtro" data-categoria="hogar">Hogar</button>
                    <button class="btn-filtro" data-categoria="tecnologia">Tecnología</button>
                    <button class="btn-filtro" data-categoria="deportes">Deportes</button>
                </div>
            </section>

            <section class="stats-section">
                <h2>Estadísticas</h2>
                <div class="stat-card">
                    <p>Total de productos:</p>
                    <strong id="stat-total-items">0</strong>
                </div>
                <div class="stat-card">
                    <p>Valor del Inventario:</p>
                    <strong id="stat-valor-total">$0.00</strong>
                </div>
            </section>

        </aside>

        <section class="catalog-section">
            
            <div id="grilla-productos" class="grid-layout">
                </div>
        </section>

    </main>

    <div id="panel-detalle" class="modal-hidden">
        <div class="modal-content">
            <button id="btn-cerrar-modal" class="btn-close">X</button>
            <div class="modal-body">
                <img id="detalle-imagen" src="" alt="Imagen detalle">
                <div class="modal-text">
                    <h2 id="detalle-nombre">Título Producto</h2>
                    <p id="detalle-categoria" class="badge">Categoría</p>
                    <p id="detalle-precio" class="price-large"></p>
                    <p id="detalle-stock"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
